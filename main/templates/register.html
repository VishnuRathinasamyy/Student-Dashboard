{% extends "base.html" %}
{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-6">
      <h3>Create student account</h3>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary">Register</button>
      </form>
      <p class="mt-2">Already have account? <a href="{% url 'login' %}">Login</a></p>
    </div>
  </div>
{% endblock %}

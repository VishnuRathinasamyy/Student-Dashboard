{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}
{% block content %}

<h2 class="text-center">Reset Your Password</h2>
<p class="text-center">Enter your email to receive reset instructions.</p>

<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}

    <button class="btn btn-primary w-100 mt-3" type="submit">
        Send Reset Link
    </button>
</form>

{% endblock %}
